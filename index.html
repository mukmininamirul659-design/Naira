<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naira — Personal Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #26304d 0%,
          #10131c 45%,
          #07080d 100%
        );
      color: white;
      display: flex;
      justify-content: center;
    }
    button {
      border: none;
      cursor: pointer;
      color: white;
    }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 22px 18px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #4f46e5
        );
      box-shadow:
        0 0 25px rgba(124, 92, 246, .45);
      font-size: 22px;
    }
    .brand h1 {
      font-size: 21px;
      font-weight: 650;
    }
    .status {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 3px;
    }
    .online {
      color: #65e6a8;
    }
    .header-buttons {
      display: flex;
      gap: 8px;
    }
    .header-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 19px;
    }
    .welcome {
      text-align: center;
      margin-top: 45px;
      margin-bottom: 35px;
    }
    .welcome-orb {
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 30%,
          #d8c7ff,
          #8b5cf6 38%,
          #4338ca 70%,
          #17122e
        );
      box-shadow:
        0 0 35px rgba(139, 92, 246, .45),
        0 0 80px rgba(79, 70, 229, .18);
      animation:
        breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }
    .welcome h2 {
      font-size: 28px;
      margin-bottom: 9px;
    }
    .welcome p {
      color: #a7adbd;
      font-size: 15px;
    }
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }
    .message {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .naira-message {
      align-self: flex-start;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.06);
      color: #e8eaf0;
      border-bottom-left-radius: 5px;
    }
    .user-message {
      align-self: flex-end;
      background:
        linear-gradient(
          135deg,
          #6d4df5,
          #4f46e5
        );
      border-bottom-right-radius: 5px;
    }
    .input-area {
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 10px;
      background:
        rgba(20, 22, 32, .82);
      border:
        1px solid rgba(255,255,255,.09);
      border-radius: 22px;
      backdrop-filter: blur(18px);
      box-shadow:
        0 12px 35px rgba(0,0,0,.3);
    }
    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 10px;
    }
    #messageInput::placeholder {
      color: #777d8d;
    }
    .mic,
    .send {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .mic {
      background: rgba(255,255,255,.08);
      transition: .2s ease;
    }
    .mic.listening {
      background: rgba(239,68,68,.22);
      box-shadow:
        0 0 0 5px rgba(239,68,68,.08),
        0 0 25px rgba(239,68,68,.3);
      animation:
        micPulse 1.3s infinite;
    }
    .mic.speaking {
      background: rgba(139,92,246,.25);
      box-shadow:
        0 0 0 5px rgba(139,92,246,.08),
        0 0 25px rgba(139,92,246,.35);
    }
    @keyframes micPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }
    .send {
      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #4f46e5
        );
      box-shadow:
        0 5px 18px rgba(99, 72, 220, .35);
    }
    .footer {
      text-align: center;
      color: #5f6472;
      font-size: 10px;
      margin-top: 12px;
    }
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 58px;
      min-height: 42px;
      padding: 13px 16px;
    }
    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      display: block;
      animation:
        typingBounce 1.4s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(1) {
      animation-delay: 0s;
    }
    .typing-indicator span:nth-child(2) {
      animation-delay: .2s;
    }
    .typing-indicator span:nth-child(3) {
      animation-delay: .4s;
    }
    @keyframes typingBounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: .4;
      }
      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }
    @media (max-height: 700px) {
      .welcome {
        margin-top: 20px;
        margin-bottom: 20px;
      }
      .welcome-orb {
        width: 85px;
        height: 85px;
      }
    }
  </style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <div class="avatar">
        N
      </div>
      <div>
        <h1>Naira</h1>
        <div class="status">
          <span class="online">●</span>
          Personal Assistant
        </div>
      </div>
    </div>
    <div class="header-buttons">
      <button
        class="header-button"
        id="historyButton"
        type="button"
      >
        💬
      </button>
      <button
        class="header-button"
        id="memoryButton"
        type="button"
      >
        🧠
      </button>
    </div>
  </header>
  <section class="welcome">
    <div class="welcome-orb"></div>
    <h2>
      Hai, Cik Amirul 👋
    </h2>
    <p>
      Naira ada dengan Tuan.
    </p>
  </section>
  <section
    class="chat"
    id="chat"
  >
    <div class="message naira-message">
      Hai Tuan ❤️ Saya Naira. Apa yang Tuan nak buat hari ini?
    </div>
  </section>
  <div class="input-area">
    <button
      class="mic"
      id="micButton"
      type="button"
      aria-label="Voice"
      title="Tekan untuk bercakap"
    >
      🎙️
    </button>
    <input
      id="messageInput"
      type="text"
      placeholder="Cakap dengan Naira..."
      autocomplete="off"
    >
    <button
      class="send"
      id="sendButton"
      type="button"
    >
      ➤
    </button>
  </div>
  <div class="footer">
    Naira • Personal Assistant
  </div>
</main>
<script>
/* ============================================================
   CONFIG
============================================================ */
const API_BASE =
  "https://naira-tawny.vercel.app";
/* ============================================================
   CONVERSATION
============================================================ */
let currentConversationId =
  localStorage.getItem(
    "naira_conversation_id"
  );
function createConversationId() {
  return (
    "conv_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 10)
  );
}
function ensureConversationId() {
  if (!currentConversationId) {
    currentConversationId =
      createConversationId();
    localStorage.setItem(
      "naira_conversation_id",
      currentConversationId
    );
  }
}
ensureConversationId();
/* ============================================================
   DOM
============================================================ */
const input =
  document.getElementById(
    "messageInput"
  );
const sendButton =
  document.getElementById(
    "sendButton"
  );
const chat =
  document.getElementById(
    "chat"
  );
const micButton =
  document.getElementById(
    "micButton"
  );
/* ============================================================
   MESSAGE
============================================================ */
function addMessage(
  text,
  type
) {
  const message =
    document.createElement(
      "div"
    );
  message.className =
    "message " + type;
  message.textContent =
    text;
  chat.appendChild(
    message
  );
  message.scrollIntoView({
    behavior: "smooth",
    block: "end"
  });
}
/* ============================================================
   NAIRA VOICE ENGINE
   FEMALE MALAY / SOFT ANIME STYLE
============================================================ */
let recognition = null;
let listening = false;
let speaking = false;
let nairaSpeech = null;
let voices = [];
/* ============================================================
   VOICE PREFERENCES
============================================================ */
const NAIRA_VOICE_SETTINGS = {
  language:
    "ms-MY",
  fallbackLanguages: [
    "ms",
    "id-ID",
    "id",
    "en-MY",
    "en-US"
  ],
  rate:
    0.88,
  pitch:
    1.12,
  volume:
    1.0
};
/* ============================================================
   LOAD VOICES
============================================================ */
function loadVoices() {
  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }
  voices =
    window.speechSynthesis
      .getVoices();
  console.log(
    "🔊 Available voices:",
    voices
  );
}
if (
  "speechSynthesis" in window
) {
  loadVoices();
  window.speechSynthesis
    .onvoiceschanged =
    function() {
      loadVoices();
    };
}
/* ============================================================
   CHECK FEMALE VOICE NAME
============================================================ */
function looksFemaleVoice(
  voice
) {
  const name =
    (
      voice.name ||
      ""
    )
      .toLowerCase();
  const femaleKeywords = [
    "female",
    "woman",
    "girl",
    "zira",
    "samantha",
    "victoria",
    "karen",
    "moira",
    "ava",
    "susan",
    "aria",
    "jenny",
    "sara",
    "siri",
    "google bahasa melayu",
    "malay female"
  ];
  return femaleKeywords.some(
    function(keyword) {
      return name.includes(
        keyword
      );
    }
  );
}
/* ============================================================
   FIND BEST NAIRA VOICE
============================================================ */
function findNairaVoice() {
  if (!voices.length) {
    loadVoices();
  }
  if (!voices.length) {
    return null;
  }
  /*
   * 1.
   * Cuba cari Bahasa Melayu Malaysia
   */
  let candidates =
    voices.filter(
      function(voice) {
        return (
          voice.lang &&
          voice.lang
            .toLowerCase()
            .startsWith("ms")
        );
      }
    );
  /*
   * 2.
   * Kalau ada voice Melayu,
   * utamakan voice perempuan.
   */
  let femaleMalay =
    candidates.find(
      function(voice) {
        return looksFemaleVoice(
          voice
        );
      }
    );
  if (femaleMalay) {
    return femaleMalay;
  }
  /*
   * 3.
   * Cari voice Melayu biasa.
   */
  if (candidates.length) {
    return candidates[0];
  }
  /*
   * 4.
   * Fallback Indonesia.
   */
  for (
    const language of
    NAIRA_VOICE_SETTINGS.fallbackLanguages
  ) {
    candidates =
      voices.filter(
        function(voice) {
          return (
            voice.lang &&
            voice.lang
              .toLowerCase()
              .startsWith(
                language
              )
          );
        }
      );
    if (candidates.length) {
      femaleMalay =
        candidates.find(
          function(voice) {
            return looksFemaleVoice(
              voice
            );
          }
        );
      if (femaleMalay) {
        return femaleMalay;
      }
      return candidates[0];
    }
  }
  /*
   * 5.
   * Last fallback:
   * cari voice yang nampak perempuan.
   */
  const femaleVoice =
    voices.find(
      function(voice) {
        return looksFemaleVoice(
          voice
        );
      }
    );
  if (femaleVoice) {
    return femaleVoice;
  }
  return voices[0];
}
/* ============================================================
   VOICE UI
============================================================ */
function updateVoiceUI() {
  if (!micButton) {
    return;
  }
  micButton.classList.remove(
    "listening",
    "speaking"
  );
  if (listening) {
    micButton.classList.add(
      "listening"
    );
    micButton.textContent =
      "🔴";
    micButton.title =
      "Naira sedang mendengar — tekan untuk berhenti";
    return;
  }
  if (speaking) {
    micButton.classList.add(
      "speaking"
    );
    micButton.textContent =
      "🔊";
    micButton.title =
      "Naira sedang bercakap — tekan untuk hentikan";
    return;
  }
  micButton.textContent =
    "🎙️";
  micButton.title =
    "Tekan untuk bercakap";
}
/* ============================================================
   STOP SPEAKING
============================================================ */
function stopSpeaking() {
  if (
    "speechSynthesis" in window
  ) {
    window.speechSynthesis.cancel();
  }
  nairaSpeech =
    null;
  speaking =
    false;
  updateVoiceUI();
}
/* ============================================================
   CLEAN TEXT FOR SPEECH
============================================================ */
function cleanTextForSpeech(
  text
) {
  return String(
    text || ""
  )
    /*
     * buang markdown
     */
    .replace(
      /[*_`#]/g,
      ""
    )
    /*
     * buang URL
     */
    .replace(
      /https?:\/\/\S+/gi,
      ""
    )
    /*
     * kurangkan emoji
     */
    .replace(
      /[\u{1F300}-\u{1FAFF}]/gu,
      ""
    )
    /*
     * kemaskan spacing
     */
    .replace(
      /\s+/g,
      " "
    )
    .trim();
}
/* ============================================================
   SPEAK NAIRA
============================================================ */
function speakNaira(
  text
) {
  const cleanText =
    cleanTextForSpeech(
      text
    );
  if (!cleanText) {
    return;
  }
  if (
    !("speechSynthesis" in window)
  ) {
    console.warn(
      "🔊 Browser tidak menyokong Text-to-Speech."
    );
    return;
  }
  stopSpeaking();
  const utterance =
    new SpeechSynthesisUtterance(
      cleanText
    );
  nairaSpeech =
    utterance;
  /*
   * Bahasa Melayu
   */
  utterance.lang =
    NAIRA_VOICE_SETTINGS.language;
  /*
   * Suara perlahan,
   * lembut dan feminin-ish.
   */
  utterance.rate =
    NAIRA_VOICE_SETTINGS.rate;
  utterance.pitch =
    NAIRA_VOICE_SETTINGS.pitch;
  utterance.volume =
    NAIRA_VOICE_SETTINGS.volume;
  /*
   * Cari voice terbaik.
   */
  const nairaVoice =
    findNairaVoice();
  if (nairaVoice) {
    utterance.voice =
      nairaVoice;
    console.log(
      "🌸 Naira voice:",
      nairaVoice.name,
      nairaVoice.lang
    );
  } else {
    console.warn(
      "🌸 Tiada voice khusus dijumpai."
    );
  }
  utterance.onstart =
    function() {
      speaking =
        true;
      updateVoiceUI();
      console.log(
        "🔊 Naira sedang bercakap..."
      );
    };
  utterance.onend =
    function() {
      speaking =
        false;
      nairaSpeech =
        null;
      updateVoiceUI();
      console.log(
        "🔊 Naira selesai bercakap."
      );
    };
  utterance.onerror =
    function(event) {
      speaking =
        false;
      nairaSpeech =
        null;
      updateVoiceUI();
      console.error(
        "🔊 TTS ERROR:",
        event.error
      );
    };
  /*
   * Sesetengah mobile browser
   * lebih stabil jika speech dimasukkan
   * selepas sedikit delay.
   */
  setTimeout(
    function() {
      window.speechSynthesis
        .speak(
          utterance
        );
    },
    80
  );
}
/* ============================================================
   SPEECH RECOGNITION
============================================================ */
function setupRecognition() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;
  if (!Recognition) {
    console.warn(
      "🎙️ Speech Recognition tidak disokong browser."
    );
    return;
  }
  recognition =
    new Recognition();
  recognition.lang =
    "ms-MY";
  recognition.interimResults =
    false;
  recognition.continuous =
    false;
  recognition.maxAlternatives =
    1;
  recognition.onstart =
    function() {
      listening =
        true;
      updateVoiceUI();
    };
  recognition.onresult =
    function(event) {
      const transcript =
        event.results?.[0]?.[0]
          ?.transcript
          ?.trim();
      if (!transcript) {
        return;
      }
      console.log(
        "🎙️ Tuan:",
        transcript
      );
      input.value =
        transcript;
      /*
       * AUTO SEND
       */
      if (
        typeof window.sendMessage ===
        "function"
      ) {
        window.sendMessage();
      }
    };
  recognition.onerror =
    function(event) {
      console.error(
        "🎙️ Recognition error:",
        event.error
      );
      listening =
        false;
      updateVoiceUI();
    };
  recognition.onend =
    function() {
      listening =
        false;
      updateVoiceUI();
    };
}
/* ============================================================
   START LISTENING
============================================================ */
function startListening() {
  if (!recognition) {
    addMessage(
      "🎙️ Browser ini tidak menyokong voice recognition.",
      "naira-message"
    );
    return;
  }
  if (listening) {
    return;
  }
  if (speaking) {
    stopSpeaking();
  }
  try {
    try {
  recognition.start();
} catch (error) {
  console.error(
    "🎙️ Gagal memulakan microphone:",
    error
  );
}
/* ============================================================
   STOP LISTENING
============================================================ */
function stopListening() {
  if (!recognition) {
    return;
  }
  try {
    recognition.stop();
  } catch (error) {
    console.error(
      "Stop microphone error:",
      error
    );
  }
}
/* ============================================================
   MIC BUTTON
============================================================ */
micButton.addEventListener(
  "click",
  function() {
    if (speaking) {
      stopSpeaking();
      return;
    }
    if (listening) {
      stopListening();
      return;
    }
    startListening();
  }
);
/* ============================================================
   GLOBAL VOICE API
============================================================ */
window.NairaVoice = {
  start:
    startListening,
  stop:
    stopListening,
  speak:
    speakNaira,
  stopSpeaking:
    stopSpeaking,
  isListening:
    function() {
      return listening;
    },
  isSpeaking:
    function() {
      return speaking;
    },
  listVoices:
    function() {
      return voices;
    }
};
/* ============================================================
   SEND MESSAGE
============================================================ */
async function sendMessage() {
  const text =
    input.value.trim();
  if (!text) {
    return;
  }
  ensureConversationId();
  if (speaking) {
    stopSpeaking();
  }
  addMessage(
    text,
    "user-message"
  );
  input.value =
    "";
  sendButton.disabled =
    true;
  const loading =
    document.createElement(
      "div"
    );
  loading.className =
    "message naira-message typing-indicator";
  loading.innerHTML = `
    <span></span>
    <span></span>
    <span></span>
  `;
  chat.appendChild(
    loading
  );
  try {
    const response =
      await fetch(
        API_BASE +
          "/api/chat",
        {
          method:
            "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              message:
                text,
              conversationId:
                currentConversationId
            })
        }
      );
    const raw =
      await response.text();
    let data = {};
    try {
      data =
        raw
          ? JSON.parse(raw)
          : {};
    } catch {
      data = {
        error:
          raw ||
          "Server response tidak sah."
      };
    }
    loading.remove();
    if (!response.ok) {
      addMessage(
        data.error ||
          `Server error (${response.status})`,
        "naira-message"
      );
      return;
    }
    const nairaReply =
      data.reply ||
      data.message ||
      "Maaf Tuan, Naira tak menerima jawapan.";
    /*
     * Papar text
     */
    addMessage(
      nairaReply,
      "naira-message"
    );
    /*
     * TERUS CAKAP
     */
    speakNaira(
      nairaReply
    );
  } catch (error) {
    console.error(
      "CHAT ERROR:",
      error
    );
    loading.remove();
    const errorText =
      "Maaf Tuan ❤️ Naira tak dapat menyambung ke server sekarang.";
    addMessage(
      errorText,
      "naira-message"
    );
    /*
     * Jangan cuba bercakap
     * mesej error teknikal panjang.
     */
  } finally {
    sendButton.disabled =
      false;
    input.focus();
  }
}
/* ============================================================
   GLOBAL SEND
============================================================ */
window.sendMessage =
  sendMessage;
sendButton.addEventListener(
  "click",
  sendMessage
);
input.addEventListener(
