<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naira — Personal Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #26304d 0%, #10131c 45%, #07080d 100%);
      color: white;
      display: flex;
      justify-content: center;
    }
    button {
      border: none;
      cursor: pointer;
      color: white;
    }
    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 22px 18px;
    }
    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      box-shadow: 0 0 25px rgba(124, 92, 246, .45);
      font-size: 22px;
    }
    .brand h1 {
      font-size: 21px;
      font-weight: 650;
    }
    .status {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 3px;
    }
    .online {
      color: #65e6a8;
    }
    .memory-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 20px;
    }
    /* WELCOME */
    .welcome {
      text-align: center;
      margin-top: 45px;
      margin-bottom: 35px;
    }
    .welcome-orb {
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 30%,
          #d8c7ff,
          #8b5cf6 38%,
          #4338ca 70%,
          #17122e
        );
      box-shadow:
        0 0 35px rgba(139, 92, 246, .45),
        0 0 80px rgba(79, 70, 229, .18);
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }
    .welcome h2 {
      font-size: 28px;
      margin-bottom: 9px;
    }
    .welcome p {
      color: #a7adbd;
      font-size: 15px;
    }
    /* CHAT */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }
    .message {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
    }
    .naira-message {
      align-self: flex-start;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.06);
      color: #e8eaf0;
      border-bottom-left-radius: 5px;
    }
    .user-message {
      align-self: flex-end;
      background: linear-gradient(135deg, #6d4df5, #4f46e5);
      border-bottom-right-radius: 5px;
    }
    /* INPUT */
    .input-area {
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 10px;
      background: rgba(20, 22, 32, .82);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 22px;
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
    }
    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 10px;
    }
    #messageInput::placeholder {
      color: #777d8d;
    }
    .mic,
    .send {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .mic {
      background: rgba(255,255,255,.08);
    }
    .send {
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      box-shadow: 0 5px 18px rgba(99, 72, 220, .35);
    }
    .mic:active,
    .send:active,
    .memory-button:active {
      transform: scale(.92);
    }
    .footer {
      text-align: center;
      color: #5f6472;
      font-size: 10px;
      margin-top: 12px;
    }
    /* MEMORY CENTER */
    .memory-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(5, 6, 10, .82);
      backdrop-filter: blur(14px);
      padding: 20px;
      overflow-y: auto;
    }
    .memory-panel.active {
      display: block;
    }
    .memory-box {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background:
        linear-gradient(
          145deg,
          rgba(31, 34, 50, .98),
          rgba(13, 15, 24, .98)
        );
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .memory-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .memory-header h2 {
      font-size: 22px;
    }
    .close-memory {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      font-size: 18px;
    }
    .memory-add {
      width: 100%;
      padding: 14px;
      border-radius: 15px;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      font-size: 14px;
      margin-bottom: 18px;
    }
    .memory-category {
      margin-bottom: 22px;
    }
    .category-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      margin-bottom: 9px;
      color: #cfd2dc;
    }
    .memory-card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 15px;
      padding: 13px;
      margin-bottom: 8px;
    }
    .memory-text {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .memory-meta {
      font-size: 11px;
      color: #858b9c;
      margin-bottom: 10px;
    }
    .memory-actions {
      display: flex;
      gap: 8px;
    }
    .memory-actions button {
      flex: 1;
      padding: 9px;
      border-radius: 10px;
      font-size: 12px;
      background: rgba(255,255,255,.08);
    }
    .memory-actions .delete {
      background: rgba(239,68,68,.18);
      color: #ff9b9b;
    }
    .empty-memory {
      text-align: center;
      color: #777d8d;
      font-size: 13px;
      padding: 20px;
    }
    .memory-status {
      text-align: center;
      color: #7f8799;
      font-size: 12px;
      margin-bottom: 15px;
    }
    @media (max-height: 700px) {
      .welcome {
        margin-top: 20px;
        margin-bottom: 20px;
      }
      .welcome-orb {
        width: 85px;
        height: 85px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="avatar">N</div>
        <div>
          <h1>Naira</h1>
          <div class="status">
            <span class="online">●</span> Personal Assistant
          </div>
        </div>
      </div>
      <button
        class="memory-button"
        id="memoryButton"
        aria-label="Memory Center"
      >
        🧠
      </button>
    </header>
    <section class="welcome">
      <div class="welcome-orb"></div>
      <h2>Hai, Cik Amirul 👋</h2>
      <p>Naira ada dengan Tuan.</p>
    </section>
    <section class="chat" id="chat">
      <div class="message naira-message">
        Hai Tuan ❤️ Saya Naira. Apa yang Tuan nak buat hari ini?
      </div>
    </section>
    <div class="input-area">
      <button
        class="mic"
        id="micButton"
        aria-label="Voice"
      >
        🎙️
      </button>
      <input
        id="messageInput"
        type="text"
        placeholder="Cakap dengan Naira..."
        autocomplete="off"
      >
      <button
        class="send"
        id="sendButton"
        aria-label="Send"
      >
        ➤
      </button>
    </div>
    <div class="footer">
      Naira • Personal Assistant
    </div>
  </main>
  <!-- MEMORY CENTER -->
  <div
    class="memory-panel"
    id="memoryPanel"
  >
    <div class="memory-box">
      <div class="memory-header">
        <h2>🧠 Memory Center</h2>
        <button
          class="close-memory"
          id="closeMemory"
        >
          ✕
        </button>
      </div>
      <div
        class="memory-status"
        id="memoryStatus"
      >
        Memuatkan memory...
      </div>
      <button
        class="memory-add"
        id="addMemoryButton"
      >
        ＋ Tambah Memory
      </button>
      <div id="memoryList"></div>
    </div>
  </div>
  <script>
    const API_BASE =
      "https://naira-tawny.vercel.app";
    /* ================================
       CHAT
    ================================= */
    const input =
      document.getElementById("messageInput");
    const sendButton =
      document.getElementById("sendButton");
    const chat =
      document.getElementById("chat");
    const micButton =
      document.getElementById("micButton");
    function addMessage(text, type) {
      const message =
        document.createElement("div");
      message.className =
        "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }
    async function sendMessage() {
      const text =
        input.value.trim();
      if (!text) return;
      addMessage(
        text,
        "user-message"
      );
      input.value = "";
      const loading =
        document.createElement("div");
      loading.className =
        "message naira-message";
      loading.textContent =
        "Naira sedang berfikir... ❤️";
      chat.appendChild(loading);
      try {
        const response =
          await fetch(
            API_BASE + "/api/chat",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                message: text
              })
            }
          );
        const data =
          await response.json();
        loading.remove();
        if (!response.ok) {
          addMessage(
            data.error ||
            "Maaf Tuan, Naira mengalami masalah.",
            "naira-message"
          );
          return;
        }
        addMessage(
          data.reply ||
          "Maaf Tuan, Naira tak dapat menghasilkan jawapan.",
          "naira-message"
        );
      } catch (error) {
        console.error(error);
        loading.remove();
        addMessage(
          "Maaf Tuan ❤️ Naira tak dapat menyambung ke server sekarang.",
          "naira-message"
        );
      }
    }
    sendButton.addEventListener(
      "click",
      sendMessage
    );
    input.addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      }
    );
    /* ================================
       VOICE
    ================================= */
    micButton.addEventListener(
      "click",
      function() {
        if (
          !("webkitSpeechRecognition" in window) &&
          !("SpeechRecognition" in window)
        ) {
          addMessage(
            "Voice recognition belum disokong oleh browser ini.",
            "naira-message"
          );
          return;
        }
        const SpeechRecognition =
          window.SpeechRecognition ||
          window.webkitSpeechRecognition;
        const recognition =
          new SpeechRecognition();
        recognition.lang =
          "ms-MY";
        recognition.interimResults =
          false;
        recognition.start();
        micButton.textContent =
          "🔴";
        recognition.onresult =
          function(event) {
            input.value =
              event.results[0][0].transcript;
            micButton.textContent =
              "🎙️";
          };
        recognition.onerror =
          function() {
            micButton.textContent =
              "🎙️";
          };
        recognition.onend =
          function() {
            micButton.textContent =
              "🎙️";
          };
      }
    );
    /* ================================
       MEMORY CENTER
    ================================= */
    const memoryButton =
      document.getElementById(
        "memoryButton"
      );
    const memoryPanel =
      document.getElementById(
        "memoryPanel"
      );
    const closeMemory =
      document.getElementById(
        "closeMemory"
      );
    const memoryList =
      document.getElementById(
        "memoryList"
      );
    const memoryStatus =
      document.getElementById(
        "memoryStatus"
      );
    const addMemoryButton =
      document.getElementById(
        "addMemoryButton"
      );
    memoryButton.addEventListener(
      "click",
      function() {
        memoryPanel.classList.add(
          "active"
        );
        loadMemories();
      }
    );
    closeMemory.addEventListener(
      "click",
      function() {
        memoryPanel.classList.remove(
          "active"
        );
      }
    );
    async function loadMemories() {
      memoryStatus.textContent =
        "Memuatkan memory...";
      memoryList.innerHTML = "";
      try {
        const response =
          await fetch(
            API_BASE + "/api/memory",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                action: "list"
              })
            }
          );
        const data =
          await response.json();
        if (!response.ok) {
          throw new Error(
            data.error ||
            "Memory gagal dimuatkan."
          );
        }
        memoryStatus.textContent =
          `${data.memories.length} memory disimpan`;
        renderMemories(
          data.memories
        );
      } catch (error) {
        console.error(error);
        memoryStatus.textContent =
          "Gagal memuatkan memory.";
        memoryList.innerHTML =
          `<div class="empty-memory">
            ❌ ${error.message}
          </div>`;
      }
    }
    function renderMemories(memories) {
      if (!memories.length) {
        memoryList.innerHTML =
          `<div class="empty-memory">
            Belum ada memory.
          </div>`;
        return;
      }
      const groups = {};
      memories.forEach(
        function(memory) {
          const category =
            memory.category ||
            "general";
          if (!groups[category]) {
            groups[category] = [];
          }
          groups[category].push(
            memory
          );
        }
      );
      const categoryInfo = {
        profile: "👤 Profile",
        fashion: "👕 Fashion",
        food: "🍔 Food",
        game: "🎮 Game",
        hobby: "🎨 Hobby",
        work: "💼 Work",
        project: "🚀 Project",
        preference: "❤️ Preference",
        family: "👨‍👩‍👧 Family",
        general: "📁 General"
      };
      Object.keys(groups)
        .forEach(
          function(category) {
            const section =
              document.createElement(
                "div"
              );
            section.className =
              "memory-category";
            const title =
              document.createElement(
                "div"
              );
            title.className =
              "category-title";
            title.textContent =
              categoryInfo[category] ||
              "📁 " + category;
            section.appendChild(
              title
            );
            groups[category]
              .forEach(
                function(memory) {
                  const card =
                    document.createElement(
                      "div"
                    );
                  card.className =
                    "memory-card";
                  const text =
                    document.createElement(
                      "div"
                    );
                  text.className =
                    "memory-text";
                  text.textContent =
                    memory.memory;
                  const meta =
                    document.createElement(
                      "div"
                    );
                  meta.className =
                    "memory-meta";
                  meta.textContent =
                    `${memory.subcategory || "general"} • Importance ${memory.importance}`;
                  const actions =
                    document.createElement(
                      "div"
                    );
                  actions.className =
                    "memory-actions";
                  const edit =
                    document.createElement(
                      "button"
                    );
                  edit.textContent =
                    "✏️ Edit";
                  edit.addEventListener(
                    "click",
                    function() {
                      editMemory(
                        memory
                      );
                    }
                  );
                  const deleteButton =
                    document.createElement(
                      "button"
                    );
                  deleteButton.className =
                    "delete";
                  deleteButton.textContent =
                    "🗑️ Delete";
                  deleteButton.addEventListener(
                    "click",
                    function() {
                      deleteMemory(
                        memory.id
                      );
                    }
                  );
                  actions.appendChild(
                    edit
                  );
                  actions.appendChild(
                    deleteButton
                  );
                  card.appendChild(
                    text
                  );
                  card.appendChild(
                    meta
                  );
                  card.appendChild(
                    actions
                  );
                  section.appendChild(
                    card
                  );
                }
              );
            memoryList.appendChild(
              section
            );
          }
        );
    }
    /* ================================
       ADD MEMORY
    ================================= */
    addMemoryButton.addEventListener(
      "click",
      async function() {
        const memory =
          prompt(
            "Apa yang Tuan mahu Naira ingat?"
          );
        if (!memory ||
            !memory.trim()) {
          return;
        }
        const category =
          prompt(
            "Kategori?\n\nprofile\nfashion\nfood\ngame\nhobby\nwork\nproject\npreference\nfamily\ngeneral",
            "general"
          ) || "general";
        const subcategory =
          prompt(
            "Subkategori?",
            "general"
          ) || "general";
        const importance =
          prompt(
            "Importance 1 - 3?",
            "2"
          ) || "2";
        try {
          const response =
            await fetch(
              API_BASE + "/api/memory",
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                  action: "save",
                  memory:
                    memory.trim(),
                  category:
                    category.trim(),
                  subcategory:
                    subcategory.trim(),
                  importance:
                    Number(importance)
                })
              }
            );
          const data =
            await response.json();
          if (!response.ok) {
            throw new Error(
              data.error ||
              "Memory gagal disimpan."
            );
          }
          alert(
            "✅ Memory berjaya disimpan."
          );
          loadMemories();
        } catch (error) {
          alert(
            "❌ " + error.message
          );
        }
      }
    );
    /* ================================
       EDIT MEMORY
    ================================= */
    async function editMemory(memory) {
      const newMemory =
        prompt(
          "Edit memory:",
          memory.memory
        );
      if (
        !newMemory ||
        !newMemory.trim()
      ) {
        return;
      }
      const newCategory =
        prompt(
          "Kategori:",
          memory.category
        ) || memory.category;
      const newSubcategory =
        prompt(
          "Subkategori:",
          memory.subcategory
        ) || memory.subcategory;
      const newImportance =
        prompt(
          "Importance 1 - 3:",
          memory.importance
        ) || memory.importance;
      try {
        const response =
          await fetch(
            API_BASE + "/api/memory",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                action: "update",
                id: memory.id,
                memory:
                  newMemory.trim(),
                category:
                  newCategory.trim(),
                subcategory:
                  newSubcategory.trim(),
                importance:
                  Number(newImportance)
              })
            }
          );
        const data =
          await response.json();
        if (!response.ok) {
          throw new Error(
            data.error ||
            "Memory gagal dikemaskini."
          );
        }
        alert(
          "✅ Memory berjaya dikemaskini."
        );
        loadMemories();
      } catch (error) {
        alert(
          "❌ " + error.message
        );
      }
    }
    /* ================================
       DELETE MEMORY
    ================================= */
    async function deleteMemory(id) {
      const confirmDelete =
        confirm(
          "Tuan pasti mahu padam memory ini?"
        );
      if (!confirmDelete) {
        return;
      }
      try {
        const response =
          await fetch(
            API_BASE + "/api/memory",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                action: "delete",
                id: id
              })
            }
          );
        const data =
          await response.json();
        if (!response.ok) {
          throw new Error(
            data.error ||
            "Memory gagal dipadam."
          );
        }
        alert(
          "🗑️ Memory berjaya dipadam."
        );
        loadMemories();
      } catch (error) {
        alert(
          "❌ " + error.message
        );
      }
    }
  </script>
</body>
</html>
