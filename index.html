<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naira — Personal Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #26304d 0%, #10131c 45%, #07080d 100%);
      color: white;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 22px 18px;
    }
    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      box-shadow: 0 0 25px rgba(124, 92, 246, .45);
      font-size: 22px;
    }
    .brand h1 {
      font-size: 21px;
      font-weight: 650;
    }
    .status {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 3px;
    }
    .online {
      color: #65e6a8;
    }
    /* WELCOME */
    .welcome {
      text-align: center;
      margin-top: 45px;
      margin-bottom: 35px;
    }
    .welcome-orb {
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #d8c7ff, #8b5cf6 38%, #4338ca 70%, #17122e);
      box-shadow:
        0 0 35px rgba(139, 92, 246, .45),
        0 0 80px rgba(79, 70, 229, .18);
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }
    .welcome h2 {
      font-size: 28px;
      margin-bottom: 9px;
    }
    .welcome p {
      color: #a7adbd;
      font-size: 15px;
    }
    /* CHAT */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }
    .message {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
    }
    .naira-message {
      align-self: flex-start;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.06);
      color: #e8eaf0;
      border-bottom-left-radius: 5px;
    }
    .user-message {
      align-self: flex-end;
      background: linear-gradient(135deg, #6d4df5, #4f46e5);
      border-bottom-right-radius: 5px;
    }
    /* INPUT */
    .input-area {
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 10px;
      background: rgba(20, 22, 32, .82);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 22px;
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
    }
    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 10px;
    }
    #messageInput::placeholder {
      color: #777d8d;
    }
    button {
      border: none;
      cursor: pointer;
      color: white;
    }
    .mic,
    .send {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .mic {
      background: rgba(255,255,255,.08);
    }
    .send {
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      box-shadow: 0 5px 18px rgba(99, 72, 220, .35);
    }
    .mic:active,
    .send:active {
      transform: scale(.92);
    }
    .footer {
      text-align: center;
      color: #5f6472;
      font-size: 10px;
      margin-top: 12px;
    }
    @media (max-height: 700px) {
      .welcome {
        margin-top: 20px;
        margin-bottom: 20px;
      }
      .welcome-orb {
        width: 85px;
        height: 85px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="avatar">N</div>
        <div>
          <h1>Naira</h1>
          <div class="status">
            <span class="online">●</span> Personal Assistant
          </div>
        </div>
      </div>
    </header>
    <section class="welcome">
      <div class="welcome-orb"></div>
      <h2>Hai, Cik Amirul 👋</h2>
      <p>Naira ada dengan Tuan.</p>
    </section>
    <section class="chat" id="chat">
      <div class="message naira-message">
        Hai Tuan ❤️ Saya Naira. Apa yang Tuan nak buat hari ini?
      </div>
    </section>
    <div class="input-area">
      <button class="mic" id="micButton" aria-label="Voice">
        🎙️
      </button>
      <input
        id="messageInput"
        type="text"
        placeholder="Cakap dengan Naira..."
        autocomplete="off"
      >
      <button class="send" id="sendButton" aria-label="Send">
        ➤
      </button>
    </div>
    <div class="footer">
      Naira • Personal Assistant
    </div>
  </main>
  <script>
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chat = document.getElementById("chat");
    const micButton = document.getElementById("micButton");
    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }
    async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user-message");
input.value = "";

await fetch("https://naira-tawny.vercel.app/api/comments", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    comment: text
  })
});

const loading = document.createElement("div");
loading.className = "message naira-message";
loading.textContent = "Naira sedang berfikir... ❤️";

  const loading = document.createElement("div");
  loading.className = "message naira-message";
  loading.textContent = "Naira sedang berfikir... ❤️";
  chat.appendChild(loading);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    loading.remove();

    if (!response.ok) {
      addMessage(
        data.error || "Maaf Tuan, Naira mengalami masalah.",
        "naira-message"
      );
      return;
    }

    addMessage(
      data.reply || "Maaf Tuan, Naira tak dapat menghasilkan jawapan.",
      "naira-message"
    );

  } catch (error) {
    console.error(error);
    loading.remove();

    addMessage(
      "Maaf Tuan ❤️ Naira tak dapat menyambung ke server sekarang.",
      "naira-message"
    );
  }
}
    sendButton.addEventListener("click", sendMessage);
    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
    micButton.addEventListener("click", function() {
      if (!("webkitSpeechRecognition" in window) &&
          !("SpeechRecognition" in window)) {
        addMessage(
          "Voice recognition belum disokong oleh browser ini.",
          "naira-message"
        );
        return;
      }
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = "ms-MY";
      recognition.interimResults = false;
      recognition.start();
      micButton.textContent = "🔴";
      recognition.onresult = function(event) {
        input.value =
          event.results[0][0].transcript;
        micButton.textContent = "🎙️";
      };
      recognition.onerror = function() {
        micButton.textContent = "🎙️";
      };
      recognition.onend = function() {
        micButton.textContent = "🎙️";
      };
    });
  </script>
</body>
</html>
